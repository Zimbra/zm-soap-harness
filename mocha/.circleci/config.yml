          <<: *release-branch

      # Serial
      - serial-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *release-branch

      - serial-zimbra101:
          requires:
            - serial-zimbra101-approval
          <<: *release-branch

      # Report
      - report-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *release-branch

      - report-zimbra101:
          requires:
            - report-zimbra101-approval
          <<: *release-branch

      ######################################

      # Zimbra 10.1 multinode automation run
      - run-zimbra101-multinode-approval:
          type: approval
          <<: *release-branch

      # Smoke
      - smoke-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *release-branch

      - smoke-zimbra101-multinode:
          requires:
            - smoke-zimbra101-multinode-approval
          <<: *release-branch

      # Sanity
      - sanity-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *release-branch

      - sanity-zimbra101-multinode:
          requires:
            - sanity-zimbra101-multinode-approval
          <<: *release-branch

      # Functional
      - functional-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *release-branch

      - functional-zimbra101-multinode:
          requires:
            - functional-zimbra101-multinode-approval
          <<: *release-branch

      # Regression
      - regression-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *release-branch

      - regression-zimbra101-multinode:
          requires:
            - regression-zimbra101-multinode-approval
          <<: *release-branch

      # Report
      - report-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *release-branch

      - report-zimbra101-multinode:
          requires:
            - report-zimbra101-multinode-approval
          <<: *release-branch

  ############################################################################

  # Scheduled branch workflow
  scheduled-workflow:
    triggers:
      - schedule:
          # Everyday 6 AM IST
          cron: '30 0 * * *'
          <<: *master-branch

    jobs:
      # Zimbra 10.1 automation run
      - smoke-zimbra101
      - sanity-zimbra101
      - functional-zimbra101
      - regression-zimbra101

      # Serial
      - serial-zimbra101-approval:
          type: approval

      - serial-zimbra101:
          requires:
            - serial-zimbra101-approval

      # Report
      - report-zimbra101-approval:
          type: approval

      - report-zimbra101:
          requires:
            - report-zimbra101-approval

      ######################################

      # Zimbra 10.1 multinode automation run
      - run-zimbra101-multinode-approval:
          type: approval

      # jobs
      - smoke-zimbra101-multinode:
          requires:
            - run-zimbra101-multinode-approval
