version: 2.1

############################################################################

executors:
  node-executor:
    working_directory: ~/zm-api-automation
    shell: /bin/bash
    docker:
      - image: cimg/node:24.13.1
        environment:
          TZ: 'Asia/Calcutta'
    resource_class: medium

############################################################################

references:
  add-ssh-keys: &add-ssh-keys
    add_ssh_keys:
      fingerprints: 2d:35:2b:4d:d6:b2:06:00:46:c2:87:b7:71:81:32:4e

  store-results: &store-results
    store_test_results:
      path: test-reports

  store-artifacts: &store-artifacts
    store_artifacts:
      path: test-reports

  persist-workspace: &persist-workspace
    persist_to_workspace:
      root: ~/
      paths:
        - zm-api-automation

  save-dependencies-cache: &save-dependencies-cache
    save_cache:
      paths:
        - node_modules
      key: v2-dependencies-{{ .Branch }}-{{ checksum "package.json" }}

  restore-dependencies-cache: &restore-dependencies-cache
    restore_cache:
      keys:
        - v2-dependencies-{{ .Branch }}-{{ checksum "package.json" }}
        - v2-dependencies-{{ .Branch }}-
        - v2-dependencies-

  attach-workspace: &attach-workspace
    attach_workspace:
      at: ~/

  feature-branch: &feature-branch
    filters:
      branches:
        ignore:
          - master

  master-branch: &master-branch
    filters:
      branches:
        only:
          - master

  release-branch: &release-branch
    filters:
      branches:
        only:
          - /(custom_)?release\/.*/

############################################################################

commands:
  clone-zimbra-repos: &clone-zimbra-repos
    parameters:
      repos:
        type: string

    steps:
      - run:
          name: Clone zimbra repositories
          command: |
            set -eo pipefail
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            REPOS="<< parameters.repos >>"
            echo "${REPOS}" | tr ',' '\n' | while read -r REPO_NAME; do
              echo -e "\n++++++++++++++++++++++++++++++++++++++++"
              cd "${HOME}"

              if [ ! -d "${HOME}/${REPO_NAME}/.git" ]; then
                echo "Cloning ${REPO_NAME}"
                git clone --depth 1 --no-single-branch git@github.com:Zimbra/${REPO_NAME}.git
              fi

              cd "${HOME}/${REPO_NAME}"
              echo "Fetching latest refs"
              git fetch --prune --depth 1 origin \
                "+refs/heads/${CIRCLE_BRANCH}:refs/remotes/origin/${CIRCLE_BRANCH}" \
                "+refs/heads/master:refs/remotes/origin/master" || true

              if git show-ref --verify --quiet "refs/remotes/origin/${CIRCLE_BRANCH}"; then
                git checkout -B "${CIRCLE_BRANCH}" "origin/${CIRCLE_BRANCH}"
                echo "Checked out ${CIRCLE_BRANCH}"
              else
                git checkout -B master origin/master
                echo "Branch ${CIRCLE_BRANCH} not found, using master"
              fi

              git reset --hard HEAD
              git clean -fd
            done

  run-automation:
    description: Run automation tests

    parameters:
      SERVER_ENVIRONMENT:
        type: string
        default: ZIMBRA101

      SERVER_TYPE:
        type: string
        default: CLASSIC

      SERVER_NODE:
        type: string
        default: SINGLENODE

      TESTS_PATH:
        type: string
        default: tests/**/*.js

      TEST_SUITE:
        type: string
        default: Smoke

      MOCHA_WORKERS:
        type: integer
        default: 20

      ZIMLET:
        type: boolean
        default: false

      CHAT:
        type: boolean
        default: false

      SERIAL:
        type: boolean
        default: false

      REPORT_PATH:
        type: string
        default: test-reports/${CIRCLE_JOB}

    steps:
      - checkout

      - add_ssh_keys:
          fingerprints: 2d:35:2b:4d:d6:b2:06:00:46:c2:87:b7:71:81:32:4e

      - clone-zimbra-repos:
          repos: zm-soap-client

      - *restore-dependencies-cache

      - run:
          name: Install npm dependencies
          command: |
            # Install npm packages
            npm install --no-audit

      - *save-dependencies-cache

      - run:
          name: Pre-configuration of automation run
          command: |
            # Pre-configuration
            ./.circleci/configuration.sh CONFIG_TYPE="PRE_CONFIG" SERVER_ENVIRONMENT="<< parameters.SERVER_ENVIRONMENT >>" REPORT_PATH="<< parameters.REPORT_PATH >>"

      - run:
          name: Run automation tests -g "<< parameters.TEST_SUITE >>" --workers << parameters.MOCHA_WORKERS >> --env "<< parameters.SERVER_ENVIRONMENT >>" --serverType "<< parameters.SERVER_TYPE >>" --serverNode "<< parameters.SERVER_NODE >>" --zimlet "<< parameters.ZIMLET >>" --chat "<< parameters.CHAT >>" --serial "<< parameters.SERIAL >>"
          no_output_timeout: 1h
          command: |
            set -eo pipefail

            # Split test files
            TEST_FILES=$(circleci tests glob "<< parameters.TESTS_PATH >>" | circleci tests split --split-by=timings)

            # Run tests
            echo "${TEST_FILES}" | \
            xargs -r node mocha-run.js --workers "<< parameters.MOCHA_WORKERS >>" -g "<< parameters.TEST_SUITE >>" \
              --env "<< parameters.SERVER_ENVIRONMENT >>" --serverType "<< parameters.SERVER_TYPE >>" --serverNode "<< parameters.SERVER_NODE >>" \
              --zimlet "<< parameters.ZIMLET >>" --chat "<< parameters.CHAT >>" --serial "<< parameters.SERIAL >>"

            # export serverEnvironment="<< parameters.SERVER_ENVIRONMENT >>" && \
            # export serverHost="${SERVER_HOST}" && \
            # export smtpPort="${SMTP_PORT}" && \
            # export popPort="${POP_PORT}" && \
            # export imapPort="${IMAP_PORT}" && \
            # npx mocha tests -g "<< parameters.TEST_SUITE >>" --configure true

            # # Move xunit report file under test-reports
            # mkdir -p "<< parameters.REPORT_PATH >>"
            # reportPath="<< parameters.REPORT_PATH >>"
            # testReportXmlFilePath="${reportPath}/test-report.xml"
            #
            # # Ensure report directory exists
            # mkdir -p "${reportPath}" || {
            # 	echo -e "Could not create report directory: ${reportPath}\nEXIT"
            # 	exit 1
            # }
            #
            # # Ensure xunit.xml exists
            # if [ ! -f "xunit.xml" ]; then
            # 	echo -e "xunit.xml not found\nEXIT"
            # 	exit 1
            # fi
            #
            # # Move report
            # mv xunit.xml "${testReportXmlFilePath}" || {
            # 	echo -e "Could not move xunit.xml to ${testReportXmlFilePath}\nEXIT"
            # 	exit 1
            # }
            #
            # # Generate HTML report from XML
            # node utils/xml-to-html-report.js || {
            # 	echo -e "XML to HTML report generation failed\nEXIT"
            # 	exit 1
            # }

      - run:
          name: Post-configuration of automation run
          command: |
            # Post-configuration
            ./.circleci/configuration.sh CONFIG_TYPE="POST_CONFIG" REPORT_PATH="<<parameters.REPORT_PATH>>"

      - *store-artifacts
      - *store-results
      - *save-dependencies-cache
      - *persist-workspace

  # --------------------------------------------------

  prepare-report:
    description: Prepare automation report

    parameters:
      SERVER_ENVIRONMENT:
        type: string
        default: ZIMBRA101

      REPORT_PATH:
        type: string
        default: test-reports/${CIRCLE_JOB}

    steps:
      - checkout

      - clone-zimbra-repos:
          repos: zm-soap-client

      - run:
          name: Install dependencies
          command: npm install --no-audit

      - run:
          name: Automation report
          command: node framework/report/circleci-report.js --SERVER_ENVIRONMENT="<<parameters.SERVER_ENVIRONMENT>>" REPORT_PATH="<<parameters.REPORT_PATH>>"

  # --------------------------------------------------

  build-docker-image:
    description: Build docker image and run automation tests

    steps:
      - checkout

      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build docker image
          command: |
            # Configuration
            mkdir -p test-reports
            TEST_REPORT_FILE="test-reports/smoke-report.txt"
            [ "${CIRCLE_BRANCH}" = "master" ] && TAG_NAME="latest" || TAG_NAME="${CIRCLE_BRANCH//[a-zA-Z0-9]*\//}"

            # Export environment variables for next jobs
            echo "export TAG_NAME=${TAG_NAME}" >> $BASH_ENV
            echo "export TEST_REPORT_FILE=${TEST_REPORT_FILE}" >> $BASH_ENV

            # Build docker image
            if make DOCKER_REGISTRY="${ENV_DOCKER_REGISTRY}" DOCKER_IMAGE_NAME="${ENV_DOCKER_IMAGE}" DOCKER_IMAGE_TAG="${TAG_NAME}" build; then
              echo -e "Successfully built docker image"
            else
              echo -e "Could not build docker image\nEXIT"
              exit 1
            fi

      - run:
          name: Run docker image and automation tests
          command: |
            # Run tests using docker image
            docker run -it ${ENV_DOCKER_REGISTRY}/${ENV_DOCKER_IMAGE}:${TAG_NAME} sh -c "npm run test:smoke" | tee ${TEST_REPORT_FILE}

            # Report file
            if [ ! -f "${TEST_REPORT_FILE}" ]; then
              exit 1
            fi

            # Passed tests
            totalPassedTests=$(grep -w '0 passing' ${TEST_REPORT_FILE})
            if [ ! -z "${totalPassedTests}" ]; then
              exit 1
            fi

            # Failed tests
            totalFailedTests=$(grep 'failing' ${TEST_REPORT_FILE} | head -n 1 | awk '{print $1}')
            if [ ! -z "${totalFailedTests}" ]; then
              echo "Total failed tests: ${totalFailedTests}"
              exit "${totalFailedTests}"
            fi

            # Failed tests
            totalFailedTests=$(grep 'failing' ${TEST_REPORT_FILE} | head -n 1 | awk '{print $1}')
            if [ ! -z "${totalFailedTests}" ]; then
              echo "Total failed tests: ${totalFailedTests}"
              exit "${totalFailedTests}"
            fi

      - run:
          name: Push docker image
          command: |
            # Login to docker registry
            echo -e "\n+++++ Login to docker registry: docker login ${ENV_DOCKER_REGISTRY} -u ${ENV_DOCKER_USERNAME} -p '${ENV_DOCKER_PASSWORD}'' +++++"
            if ! docker login ${ENV_DOCKER_REGISTRY} -u ${ENV_DOCKER_USERNAME} -p "${ENV_DOCKER_PASSWORD}"; then
              echo -e "Could not login to docker registry\nEXIT"
              exit 1
            else
              echo -e "Successfully logged in to docker registry"
            fi

            # Push image to dev registry
            if make DOCKER_REGISTRY="${ENV_DOCKER_REGISTRY}" DOCKER_IMAGE_NAME="${ENV_DOCKER_IMAGE}" DOCKER_IMAGE_TAG="${TAG_NAME}" push; then
              echo -e "Successfully pushed image to docker registry"
            else
              echo -e "Could not push image to docker registry\nEXIT"
              exit 1
            fi

      - *store-artifacts
      - *store-results

############################################################################

jobs:
  # Smoke
  smoke-zimbra101:
    executor: node-executor
    parallelism: 2
    steps:
      - run-automation:
          TEST_SUITE: Smoke
          MOCHA_WORKERS: 20

  smoke-zimbra101-multinode:
    executor: node-executor
    parallelism: 2
    steps:
      - run-automation:
          SERVER_ENVIRONMENT: ZIMBRA101_MULTINODE
          SERVER_NODE: MULTINODE
          TEST_SUITE: Smoke
          MOCHA_WORKERS: 20

  # Sanity
  sanity-zimbra101:
    executor: node-executor
    parallelism: 1
    steps:
      - run-automation:
          TEST_SUITE: Sanity
          MOCHA_WORKERS: 20

  sanity-zimbra101-multinode:
    executor: node-executor
    parallelism: 1
    steps:
      - run-automation:
          SERVER_ENVIRONMENT: ZIMBRA101_MULTINODE
          SERVER_NODE: MULTINODE
          TEST_SUITE: Sanity
          MOCHA_WORKERS: 20

  # Functional
  functional-zimbra101:
    executor: node-executor
    parallelism: 1
    steps:
      - run-automation:
          TEST_SUITE: Functional
          MOCHA_WORKERS: 20

  functional-zimbra101-multinode:
    executor: node-executor
    parallelism: 1
    steps:
      - run-automation:
          SERVER_ENVIRONMENT: ZIMBRA101_MULTINODE
          SERVER_NODE: MULTINODE
          TEST_SUITE: Functional
          MOCHA_WORKERS: 20

  # Regression
  regression-zimbra101:
    executor: node-executor
    parallelism: 1
    steps:
      - run-automation:
          TEST_SUITE: Regression
          MOCHA_WORKERS: 20

  regression-zimbra101-multinode:
    executor: node-executor
    parallelism: 1
    steps:
      - run-automation:
          SERVER_ENVIRONMENT: ZIMBRA101_MULTINODE
          SERVER_NODE: MULTINODE
          TEST_SUITE: Regression
          MOCHA_WORKERS: 20

  # Serial
  serial-zimbra101:
    executor: node-executor
    parallelism: 1
    steps:
      - run-automation:
          SERIAL: true
          TEST_SUITE: Serial
          MOCHA_WORKERS: 1

  # Report
  report-zimbra101:
    executor: node-executor
    parallelism: 1
    steps:
      - *attach-workspace
      - prepare-report:
          SERVER_ENVIRONMENT: ZIMBRA101
      - *store-artifacts
      - *store-results

  report-zimbra101-multinode:
    executor: node-executor
    parallelism: 1
    steps:
      - *attach-workspace
      - prepare-report:
          SERVER_ENVIRONMENT: ZIMBRA101_MULTINODE
      - *store-artifacts
      - *store-results

  # Build docker image
  build-docker-image:
    executor: node-executor
    steps:
      - build-docker-image

############################################################################

workflows:
  version: 2.1

  ######################################

  # Feature/bug branch workflow
  commit-workflow:
    jobs:
      # Zimbra 10.1 automation run

      # Smoke
      - smoke-zimbra101-approval:
          type: approval
          <<: *feature-branch

      - smoke-zimbra101:
          requires:
            - smoke-zimbra101-approval
          <<: *feature-branch

      # Sanity
      - sanity-zimbra101-approval:
          type: approval
          <<: *feature-branch

      - sanity-zimbra101:
          requires:
            - sanity-zimbra101-approval
          <<: *feature-branch

      # Functional
      - functional-zimbra101-approval:
          type: approval
          <<: *feature-branch

      - functional-zimbra101:
          requires:
            - functional-zimbra101-approval
          <<: *feature-branch

      # Regressuion
      - regression-zimbra101-approval:
          type: approval
          <<: *feature-branch

      - regression-zimbra101:
          requires:
            - regression-zimbra101-approval
          <<: *feature-branch

      # Serial
      - serial-zimbra101-approval:
          type: approval
          <<: *feature-branch

      - serial-zimbra101:
          requires:
            - serial-zimbra101-approval
          <<: *feature-branch

      # Report
      - report-zimbra101-approval:
          type: approval
          <<: *feature-branch

      - report-zimbra101:
          requires:
            - report-zimbra101-approval
          <<: *feature-branch

      ######################################

      # Zimbra 10.1 multinode automation run
      - run-zimbra101-multinode-approval:
          type: approval
          <<: *feature-branch

      # Smoke
      - smoke-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *feature-branch

      - smoke-zimbra101-multinode:
          requires:
            - smoke-zimbra101-multinode-approval
          <<: *feature-branch

      # Sanity
      - sanity-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *feature-branch

      - sanity-zimbra101-multinode:
          requires:
            - sanity-zimbra101-multinode-approval
          <<: *feature-branch

      # Functional
      - functional-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *feature-branch

      - functional-zimbra101-multinode:
          requires:
            - functional-zimbra101-multinode-approval
          <<: *feature-branch

      # Regression
      - regression-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *feature-branch

      - regression-zimbra101-multinode:
          requires:
            - regression-zimbra101-multinode-approval
          <<: *feature-branch

      # Report
      - report-zimbra101-multinode-approval:
          requires:
            - run-zimbra101-multinode-approval
          type: approval
          <<: *feature-branch

      - report-zimbra101-multinode:
          requires:
            - report-zimbra101-multinode-approval
          <<: *feature-branch

  ############################################################################

  # Master branch workflow
  master-workflow:
    jobs:
      # Zimbra 10.1 automation run
      - run-zimbra101-approval:
          type: approval
          <<: *master-branch

      # Smoke
      - smoke-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *master-branch

      - smoke-zimbra101:
          requires:
            - smoke-zimbra101-approval
          <<: *master-branch

      # Sanity
      - sanity-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *master-branch

      - sanity-zimbra101:
          requires:
            - sanity-zimbra101-approval
          <<: *master-branch

      # Functional
      - functional-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *master-branch

      - functional-zimbra101:
          requires:
            - functional-zimbra101-approval
          <<: *master-branch

      # Regression
      - regression-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *master-branch

      - regression-zimbra101:
          requires:
            - regression-zimbra101-approval
          <<: *master-branch

      # Serial
      - serial-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *master-branch

      - serial-zimbra101:
          requires:
            - serial-zimbra101-approval
          <<: *master-branch

      # Report
      - report-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *master-branch

      - report-zimbra101:
