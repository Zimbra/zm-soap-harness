      # Zimbra 10.1 automation run
      - run-zimbra101-approval:
          type: approval
          <<: *release-branch

      # Smoke
      - smoke-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *release-branch

      - smoke-zimbra101:
          requires:
            - smoke-zimbra101-approval
          <<: *release-branch

      # Sanity
      - sanity-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *release-branch

      - sanity-zimbra101:
          requires:
            - sanity-zimbra101-approval
          <<: *release-branch

      # Functional
      - functional-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *release-branch

      - functional-zimbra101:
          requires:
            - functional-zimbra101-approval
          <<: *release-branch

      # Regression
      - regression-zimbra101-approval:
          requires:
            - run-zimbra101-approval
          type: approval
          <<: *release-branch

      - regression-zimbra101:
          requires:
